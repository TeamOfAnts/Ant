version: "3.8"
services:
  db:
    image: mysql:8.0.36
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=ant
    ports:
      - "3306:3306"
  client:
    build:
      context: ./Ant-client
      dockerfile: ../Dockerfile.client
    environment:
      - PORT=8888
      - NODE_ENV=development
      - VITE_API_ENDPOINT=http://localhost:8080
      - VITE_GOOGLE_CLIENT_ID=YOUR_GOOGLE_CLIENT_ID
      - VITE_GOOGLE_REDIRECT_URI=http://localhost:3434
      - VITE_GOOGLE_SCOPE=profile email
    volumes:
      - ./Ant-client/src:/Ant-client/src
      - ./Ant-client/vite.config.ts:/Ant-client/vite.config.ts
    restart: always
    ports:
      - "8888:8888"
    depends_on:
      - server
  server:
    build:
      context: ./Ant-server
      dockerfile: ../Dockerfile.server
    environment:
      - CORS_ORIGIN=http://ant.localhost:3434
      - TZ=UTC
      - PORT=8080
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - db
    volumes:
      - ./Ant-server/src/:/Ant-server/src/
      